<?xml version="1.0" encoding="UTF-8"?>
<!--
  Standalone animated sprite: the OnTrack panda running up a flight of mossy
  stone platforms, then hopping from one to the next -- same run-then-hop
  beat as CLAUDE.md section 9 (idle -> run -> jump -> land -> idle) and the
  in-app Panda component, just as a single self-contained file you can open
  directly in a browser. Pure SVG + CSS, no raster art, no external assets.
-->
<svg
  width="360"
  height="190"
  viewBox="0 0 360 190"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="A baby chibi panda runs up a staircase of mossy stone platforms and hops between them"
>
  <title>OnTrack panda runner</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1710" />
      <stop offset="100%" stop-color="#060a07" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#12271a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#12271a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    <![CDATA[
    .fireflies circle {
      fill: #f0c04a;
      animation: flicker 2.6s ease-in-out infinite;
    }
    .fireflies circle:nth-child(2) { animation-delay: 0.6s; }
    .fireflies circle:nth-child(3) { animation-delay: 1.3s; }
    .fireflies circle:nth-child(4) { animation-delay: 1.9s; }

    @keyframes flicker {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.85; }
    }

    .flag-cloth {
      transform-origin: 0% 0%;
      animation: wave 1.6s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: skewY(0deg); }
      50% { transform: skewY(6deg); }
    }

    /* The whole rig hops step-to-step; the legs swing continuously and
       independently underneath it, same "run cycle never stops" trick
       classic platformers use. Position is always state-driven in the
       real app -- this file is a standalone demo loop, not app state. */
    .hop-rig {
      animation: pandaHop 4.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes pandaHop {
      0%   { transform: translate(-15px, -30px) scale(1, 1); }
      9%   { transform: translate(-15px, -30px) scale(1, 1.05); }
      16%  { transform: translate(30px, -62px) scale(0.95, 1.1); }
      23%  { transform: translate(75px, -58px) scale(1.15, 0.85); }
      27%  { transform: translate(75px, -58px) scale(1, 1); }
      36%  { transform: translate(75px, -58px) scale(1, 1); }
      41%  { transform: translate(75px, -58px) scale(1, 1.05); }
      48%  { transform: translate(120px, -90px) scale(0.95, 1.1); }
      55%  { transform: translate(165px, -86px) scale(1.15, 0.85); }
      59%  { transform: translate(165px, -86px) scale(1, 1); }
      68%  { transform: translate(165px, -86px) scale(1, 1); }
      73%  { transform: translate(165px, -86px) scale(1, 1.05); }
      80%  { transform: translate(210px, -118px) scale(0.95, 1.1); }
      87%  { transform: translate(255px, -114px) scale(1.15, 0.85); }
      91%  { transform: translate(255px, -114px) scale(1, 1.12); }
      95%  { transform: translate(255px, -114px) scale(1, 1); }
      100% { transform: translate(-15px, -30px) scale(1, 1); }
    }

    .leg-l, .leg-r {
      transform-box: fill-box;
      transform-origin: 50% 0%;
    }
    .leg-l { animation: legSwingL 0.26s ease-in-out infinite; }
    .leg-r { animation: legSwingR 0.26s ease-in-out infinite; }

    @keyframes legSwingL {
      0%, 100% { transform: rotate(-24deg); }
      50% { transform: rotate(24deg); }
    }
    @keyframes legSwingR {
      0%, 100% { transform: rotate(24deg); }
      50% { transform: rotate(-24deg); }
    }

    .arm-l, .arm-r {
      transform-box: fill-box;
      transform-origin: 50% 0%;
    }
    .arm-l { animation: legSwingR 0.26s ease-in-out infinite; }
    .arm-r { animation: legSwingL 0.26s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .hop-rig, .leg-l, .leg-r, .arm-l, .arm-r, .flag-cloth, .fireflies circle {
        animation: none;
      }
    }
    ]]>
  </style>

  <rect x="0" y="0" width="360" height="190" fill="url(#sky)" />
  <rect x="0" y="0" width="360" height="190" fill="url(#glow)" />

  <g class="fireflies">
    <circle cx="40" cy="30" r="1.6" />
    <circle cx="160" cy="18" r="1.4" />
    <circle cx="260" cy="34" r="1.6" />
    <circle cx="320" cy="20" r="1.3" />
  </g>

  <!-- start sign -->
  <g>
    <rect x="10" y="130" width="2.4" height="20" fill="#2a2f28" />
    <rect x="1" y="123" width="20" height="10" rx="1.5" fill="#1c231c" stroke="#4f8f52" stroke-width="1" />
    <text x="11" y="130.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="6" font-weight="700" fill="#f3e6c8">START</text>
  </g>

  <!-- four ascending mossy stone platforms -->
  <g>
    <g>
      <rect x="20" y="150" width="60" height="10" rx="3" fill="#4f8f52" stroke="#f3e6c8" stroke-width="1.5" />
      <rect x="24" y="160" width="52" height="4" fill="#2a2f28" opacity="0.8" />
    </g>
    <g>
      <rect x="110" y="122" width="60" height="10" rx="3" fill="#4f8f52" stroke="#f3e6c8" stroke-width="1.5" />
      <rect x="114" y="132" width="52" height="4" fill="#2a2f28" opacity="0.8" />
    </g>
    <g>
      <rect x="200" y="94" width="60" height="10" rx="3" fill="#4f8f52" stroke="#f3e6c8" stroke-width="1.5" />
      <rect x="204" y="104" width="52" height="4" fill="#2a2f28" opacity="0.8" />
    </g>
    <g>
      <rect x="290" y="66" width="60" height="10" rx="3" fill="#4f8f52" stroke="#f3e6c8" stroke-width="1.5" />
      <rect x="294" y="76" width="52" height="4" fill="#2a2f28" opacity="0.8" />
    </g>
  </g>

  <!-- goal flag on the last platform -->
  <g transform="translate(332, 20)">
    <rect x="0" y="0" width="2" height="46" fill="#f3e6c8" opacity="0.9" />
    <path class="flag-cloth" d="M2 0 L18 6 L2 12 Z" fill="#f0c04a" />
  </g>

  <!-- coins above each platform (purely decorative here) -->
  <g fill="#f0c04a" stroke="#8a5410" stroke-width="1">
    <circle cx="50" cy="140" r="6" />
    <circle cx="140" cy="112" r="6" />
    <circle cx="230" cy="84" r="6" />
  </g>

  <!-- panda rig: base-positioned on platform 1, animated up the staircase -->
  <g transform="translate(50, 150)">
    <g class="hop-rig">
      <g transform="scale(1.35)">
        <ellipse class="leg-l" cx="10.5" cy="28" rx="3.4" ry="2.4" fill="#fbf6e8" />
        <ellipse class="leg-r" cx="19.5" cy="28" rx="3.4" ry="2.4" fill="#fbf6e8" />
        <ellipse class="arm-l" cx="6" cy="20" rx="2.6" ry="4" fill="#fbf6e8" />
        <ellipse class="arm-r" cx="24" cy="20" rx="2.6" ry="4" fill="#fbf6e8" />
        <ellipse cx="15" cy="19" rx="11.5" ry="10" fill="#fbf6e8" />
        <ellipse cx="15" cy="12.5" rx="10.5" ry="8.6" fill="#fbf6e8" />
        <ellipse cx="8" cy="5.6" rx="4.6" ry="4.6" fill="#1c1c1c" />
        <ellipse cx="22" cy="5.6" rx="4.6" ry="4.6" fill="#1c1c1c" />
        <ellipse cx="10" cy="13" rx="3.6" ry="4.4" fill="#1c1c1c" />
        <ellipse cx="20" cy="13" rx="3.6" ry="4.4" fill="#1c1c1c" />
        <circle cx="10" cy="13" r="1.5" fill="#fbf6e8" />
        <circle cx="20" cy="13" r="1.5" fill="#fbf6e8" />
        <circle cx="9.4" cy="12.3" r="0.6" fill="#fff" />
        <circle cx="19.4" cy="12.3" r="0.6" fill="#fff" />
        <ellipse cx="8.4" cy="16.4" rx="1.7" ry="1.1" fill="#f3b8a8" opacity="0.8" />
        <ellipse cx="21.6" cy="16.4" rx="1.7" ry="1.1" fill="#f3b8a8" opacity="0.8" />
        <path d="M13.4 16.6q1.6 1.4 3.2 0" stroke="#3a332a" stroke-width="0.6" fill="none" stroke-linecap="round" />
        <ellipse cx="15" cy="15.4" rx="1.1" ry="0.8" fill="#3a332a" />
      </g>
    </g>
  </g>
</svg>
