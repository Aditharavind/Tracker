<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>75 Hard</title>
  </head>
  <body>
    <script>
      // Paint the saved theme before React boots, otherwise you get a flash of
      // dark while the bundle loads.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("75hard.theme") || "dark";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
